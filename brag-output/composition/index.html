<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Dar Safia — film de présentation</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cinzel Decorative"; font-weight: 700; src: url("assets/fonts/cinzel-decorative-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cinzel"; font-weight: 500; src: url("assets/fonts/cinzel-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-weight: 400; font-style: normal; src: url("assets/fonts/cormorant-garamond-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-weight: 400; font-style: italic; src: url("assets/fonts/cormorant-garamond-400-italic.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 500; src: url("assets/fonts/montserrat-500-normal.woff2") format("woff2"); }

      :root {
        --noir: #1a120f;
        --burgundy-deep: #2a090d;
        --burgundy: #3d0f14;
        --gold: #b8862b;
        --gold-light: #d6ab5a;
        --ivory: #f2ede3;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--noir); }
      #root { position: relative; width: 1920px; height: 1080px; background: var(--noir); color: var(--ivory); }
      .scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; }

      /* — Scène 1 — */
      #s1 { background: #000; }
      #s1 video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 62% 50%; }
      #s1 .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(10,6,5,.62) 0%, rgba(10,6,5,.9) 100%); }
      #s1 .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
      #s1 .mono { width: 150px; height: auto; opacity: 0; }
      #name { font-family: "Cinzel Decorative", Georgia, serif; font-weight: 700; font-size: 132px; letter-spacing: .16em; color: var(--gold-light); white-space: nowrap; padding-left: .16em; }
      #name span { display: inline-block; opacity: 0; }
      #tagline { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 52px; color: var(--ivory); letter-spacing: .04em; opacity: 0; }

      /* — Scène 2 — */
      #s2 { background: var(--noir); }
      #s2 .plate { position: absolute; inset: 0; background: url("assets/img/home.jpg") center / cover no-repeat; transform-origin: 30% 62%; }
      #s2 .veil { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(26,18,15,.78) 0%, rgba(26,18,15,0) 30%); }
      #s2 .eyebrow { position: absolute; top: 118px; left: 0; right: 0; text-align: center; font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 28px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-light); opacity: 0; }

      /* — Scène 3 — */
      #s3 { background: radial-gradient(ellipse at 50% 30%, #2a1a14 0%, var(--noir) 70%); }
      #s3 .frame { position: absolute; left: 240px; top: 44px; width: 1440px; height: 810px; overflow: hidden; border: 1px solid rgba(184,134,43,.55); box-shadow: 0 25px 60px rgba(0,0,0,.6); opacity: 0; }
      #s3 .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform-origin: 50% 40%; }
      #s3 .cap { position: absolute; left: 240px; top: 886px; opacity: 0; }
      #s3 .cap .eyebrow { font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 24px; letter-spacing: .26em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 14px; }
      #s3 .cap .title { font-family: "Cinzel", Georgia, serif; font-weight: 500; font-size: 58px; letter-spacing: .02em; color: var(--ivory); white-space: nowrap; }
      #s3 .count { position: absolute; right: 240px; top: 934px; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 44px; color: var(--gold-light); opacity: 0; }

      /* — Scène 4 — */
      #s4 { background: radial-gradient(ellipse at 50% 45%, var(--burgundy) 0%, var(--burgundy-deep) 85%); }
      #s4 .lines { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; }
      #s4 .line { font-family: "Cinzel", Georgia, serif; font-weight: 500; font-size: 84px; letter-spacing: .03em; color: var(--ivory); opacity: 0; display: flex; align-items: center; gap: 36px; }
      #s4 .line i { display: block; width: 56px; height: 1px; background: var(--gold); }

      /* — Scène 5 — */
      #s5 { background: radial-gradient(ellipse at 50% 42%, #2a1a14 0%, var(--noir) 75%); }
      #s5 .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #s5 .mono { width: 190px; height: auto; margin-bottom: 30px; opacity: 0; }
      #s5 .brand { font-family: "Cinzel Decorative", Georgia, serif; font-weight: 700; font-size: 128px; letter-spacing: .16em; padding-left: .16em; color: var(--gold-light); opacity: 0; }
      #s5 .rule { width: 0; height: 1px; background: var(--gold); margin: 40px 0 34px; }
      #s5 .tag { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 58px; color: var(--ivory); letter-spacing: .04em; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">

      <!-- 1 · Accroche -->
      <section id="s1" class="scene">
        <video id="hero" src="assets/video/hero.mp4" muted playsinline data-start="0" data-duration="3.8" data-media-start="0.2" data-track-index="0"></video>
        <div class="shade"></div>
        <div class="stack">
          <div id="name" aria-label="Dar Safia"></div>
          <div id="tagline">L'Élégance pour Tous</div>
        </div>
      </section>

      <!-- 2 · Révélation -->
      <section id="s2" class="scene">
        <div class="plate"></div>
        <div class="veil"></div>
        <div class="eyebrow">Maison de haute parfumerie · Algérie</div>
      </section>

      <!-- 3 · Fonctionnalités -->
      <section id="s3" class="scene">
        <div class="frame" id="frame">
          <img id="i-catalog" src="assets/img/catalog.jpg" alt="" />
          <img id="i-pyr" src="assets/img/pyr.jpg" alt="" />
          <img id="i-q2" src="assets/img/q2.jpg" alt="" />
          <img id="i-q4" src="assets/img/q4.jpg" alt="" />
          <img id="i-result" src="assets/img/result.jpg" alt="" />
        </div>
        <div class="cap" id="c-catalog"><div class="eyebrow">Le catalogue</div><div class="title">Tous les parfums</div></div>
        <div class="count" id="c-count">45 créations</div>
        <div class="cap" id="c-pyr"><div class="eyebrow">La fiche</div><div class="title">Pyramide olfactive</div></div>
        <div class="cap" id="c-quiz"><div class="eyebrow">Diagnostic olfactif</div><div class="title">Quatre questions, une recommandation.</div></div>
      </section>

      <!-- 4 · Valeur -->
      <section id="s4" class="scene">
        <div class="lines">
          <div class="line" id="l1"><i></i>Parfums 100 % originaux<i></i></div>
          <div class="line" id="l2"><i></i>Conciergerie WhatsApp<i></i></div>
          <div class="line" id="l3"><i></i>Livraison dans les 58 wilayas<i></i></div>
        </div>
      </section>

      <!-- 5 · Final -->
      <section id="s5" class="scene">
        <div class="stack">
          <img class="mono" src="assets/img/monogram.png" alt="" />
          <div class="brand">DAR SAFIA</div>
          <div class="rule"></div>
          <div class="tag">L'Élégance pour Tous</div>
        </div>
      </section>

      <!-- Audio -->
      <audio id="music" src="assets/music/bed.wav" data-start="0" data-duration="25" data-track-index="10" data-volume="2.6"></audio>
      <audio id="a-name" src="assets/sfx/impactSoft_heavy_003.wav" data-start="0.75" data-duration="0.6" data-track-index="11" data-volume="0.55"></audio>
      <audio id="a-t1" src="assets/sfx/impactSoft_medium_001.wav" data-start="3.3" data-duration="0.3" data-track-index="12" data-volume="0.4"></audio>
      <audio id="a-f1" src="assets/sfx/rollover2.wav" data-start="7.3" data-duration="0.2" data-track-index="13" data-volume="0.5"></audio>
      <audio id="a-f2" src="assets/sfx/rollover2.wav" data-start="10.5" data-duration="0.2" data-track-index="14" data-volume="0.5"></audio>
      <audio id="a-f3" src="assets/sfx/rollover2.wav" data-start="13.8" data-duration="0.2" data-track-index="15" data-volume="0.5"></audio>
      <audio id="a-c1" src="assets/sfx/click_003.wav" data-start="15.0" data-duration="0.1" data-track-index="16" data-volume="0.8"></audio>
      <audio id="a-c2" src="assets/sfx/click_003.wav" data-start="16.1" data-duration="0.1" data-track-index="17" data-volume="0.8"></audio>
      <audio id="a-v1" src="assets/sfx/bong_001.wav" data-start="17.6" data-duration="0.2" data-track-index="18" data-volume="0.45"></audio>
      <audio id="a-v2" src="assets/sfx/bong_001.wav" data-start="18.7" data-duration="0.2" data-track-index="19" data-volume="0.45"></audio>
      <audio id="a-v3" src="assets/sfx/bong_001.wav" data-start="19.8" data-duration="0.2" data-track-index="20" data-volume="0.45"></audio>
      <audio id="a-end" src="assets/sfx/impactSoft_heavy_003.wav" data-start="21.6" data-duration="0.6" data-track-index="21" data-volume="0.6"></audio>
    </div>

    <script>
      // Nom composé lettre par lettre
      const nameEl = document.getElementById("name");
      "DAR SAFIA".split("").forEach((ch) => {
        const s = document.createElement("span");
        s.textContent = ch === " " ? " " : ch;
        nameEl.appendChild(s);
      });

      const tl = gsap.timeline({ paused: true });
      const E = "power2.out";

      // — Scène 1 : accroche —
      tl.set("#s1", { opacity: 1 }, 0);
      tl.fromTo("#hero", { scale: 1.0 }, { scale: 1.12, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#s1 .shade", { opacity: 1 }, { opacity: 0.85, duration: 3.8, ease: "none" }, 0);
            tl.fromTo("#name span", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.7, ease: E, stagger: 0.07 }, 0.7);
      tl.fromTo("#tagline", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.9, ease: E }, 1.9);
      tl.to("#s1", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 3.3);

      // — Scène 2 : révélation (poussée lente) —
      tl.fromTo("#s2", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 3.3);
      tl.fromTo("#s2 .plate", { scale: 1.0 }, { scale: 1.1, duration: 4.4, ease: "none" }, 3.3);
      tl.fromTo("#s2 .eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, 4.2);
      tl.to("#s2 .eyebrow", { opacity: 0, duration: 0.4 }, 6.9);

      // — Scène 3 : fonctionnalités —
      tl.fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 7.2);
      tl.fromTo("#frame", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 7.3);
      const show = (sel, t, d) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, t);
        tl.to(sel, { opacity: 0, duration: 0.35, ease: "power1.in" }, t + d - 0.35);
      };
      const shot = (sel, t, d, end = 1.04, origin = "50% 40%") => {
        tl.set(sel, { transformOrigin: origin }, t);
        tl.fromTo(sel, { opacity: 0, scale: 1.0 }, { opacity: 1, scale: end, duration: d, ease: "none" }, t);
        // seule l'opacité sort, l'échelle continue jusqu'à la fin du plan
        tl.to(sel, { opacity: 0, duration: 0.01 }, t + d);
      };
      shot("#i-catalog", 7.3, 3.2, 1.22, "28% 30%");
      shot("#i-pyr", 10.5, 3.3, 1.28, "75% 42%");
      shot("#i-q2", 13.8, 1.2, 1.2, "30% 58%");
      shot("#i-q4", 15.0, 1.1, 1.2, "30% 58%");
      shot("#i-result", 16.1, 1.6, 1.2, "32% 40%");
      show("#c-catalog", 7.7, 2.8);
      tl.fromTo("#c-count", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 8.0);
      tl.to("#c-count", { opacity: 0, duration: 0.3 }, 10.2);
      show("#c-pyr", 10.9, 2.9);
      show("#c-quiz", 14.1, 3.3);
      tl.to("#frame", { opacity: 0, duration: 0.5, ease: "power1.in" }, 17.2);
      tl.to("#s3", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 17.2);

      // — Scène 4 : valeur —
      tl.fromTo("#s4", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 17.2);
      [["#l1", 17.6], ["#l2", 18.7], ["#l3", 19.8]].forEach(([s, t]) => {
        tl.fromTo(s, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, t);
      });
      tl.to("#s4", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 21.2);

      // — Scène 5 : final —
      tl.fromTo("#s5", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 21.2);
      tl.fromTo("#s5 .mono", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.9, ease: E }, 21.5);
      tl.fromTo("#s5 .brand", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.0, ease: E }, 21.7);
      tl.to("#s5 .rule", { width: 420, duration: 0.9, ease: E }, 22.4);
      tl.fromTo("#s5 .tag", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: E }, 22.7);
      tl.to("#s5 .stack", { scale: 1.03, duration: 3.6, ease: "none" }, 21.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
